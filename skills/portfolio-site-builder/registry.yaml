name: Portfolio Site Builder
blurb: Make a home for your photographs, from the first edit to a live website.
longDescription: Build a photography portfolio with guided steps or optional user-granted computer
  use. Choose a conversation language, review costs, gather photographs and domain resources, build
  with the included trilingual template, preview, then publish on Cloudflare Pages or Squarespace.
  Cloudflare remains recommended for mainland China audiences. Your edit and publishing decisions
  stay yours.
tags:
  - portfolio
  - website
  - beginner
  - no-code
  - i18n
  - publishing
featured: true
installTargets:
  - assistant: codex
    label: Codex
    command: npx skills add photoreason/skills --skill portfolio-site-builder --agent codex
  - assistant: claude-code
    label: Claude Code
    command: npx skills add photoreason/skills --skill portfolio-site-builder --agent claude-code
  - assistant: kimi-code-cli
    label: Kimi Code
    command: npx skills add photoreason/skills --skill portfolio-site-builder --agent kimi-code-cli
universalCommand: npx skills add photoreason/skills --skill portfolio-site-builder
sampleVisuals:
  - /lab-examples/portfolio-site-builder/assets/portfolio-workbench.svg
demoPath: portfolio-study/index.html
guide:
  en:
    intro: A home for your photographs.
    demoTitle: Study 01 — A quieter sequence
    demoCaption: Template preview · illustrations stand in for photographs
    demoPrompt: Help me make a portfolio for one coastal series. Keep the interface quiet, show the work
      large, and make it readable in English, Japanese, and Chinese.
    revision: Give the images more room. Keep the project together as a sequence instead of turning each
      frame into a card.
    revisionNote: "The study uses the template’s stacked layout: one image per row, a restrained project
      index, and no decorative animation. These are example directions to try, not a transcript of a
      commissioned project."
    prepare: Photographs grouped by project, in your preferred order. Your name, a short introduction
      and a contact address you want to make public. A domain can wait. Use WebP or JPEG web copies
      and keep the originals.
    firstPrompt: Use Portfolio Site Builder to help me make a photography portfolio. Ask which language
      I would like to chat in first, then help me review costs and prepare the photographs. Keep my
      selection and sequence, and show me a preview before publishing.
    steps:
      - title: Start with your work
        body: Choose a chat language, review costs and gather pictures and text.
      - title: Make a first version
        body: Use the template and review it on a phone and a larger screen.
      - title: Publish when ready
        body: Cloudflare is the starting recommendation; Squarespace is an option.
    principles:
      - title: What guides the design?
        body: Begin with the photographs, as you would when laying out prints on a table. Keep the interface
          quiet and let each project find its rhythm. The selection and sequence belong to the
          photographer.
    making:
      - title: Making notes
        body: Plain HTML, CSS and JavaScript. English, Japanese and Simplified Chinese text in separate
          files, with one shared photo sequence. Source files, licensing and validation records are
          available on GitHub.
    references:
      - title: Explore the portfolio template
        url: https://github.com/photoreason/skills/tree/main/skills/portfolio-site-builder/templates/portfolio
        reason: The page structure, styles, and language files included with the skill. A starting point you
          can make your own.
    overview: Bring a selection of pictures and a few words. Build from the included template, review a
      preview, and publish when it feels ready.
    costNote: The skill is free. Assistant, domain and hosting costs are considered separately.
    outcomes:
      - title: A portfolio template
        body: Large images, generous space and your chosen sequence.
      - title: Ways to look closer
        body: Project index, thumbnails, full-screen viewing and zoom.
      - title: A site you can update
        body: Keep the files. Change a photograph or add a project later.
    questions:
      - title: What should I bring?
        body: Photographs grouped by project, in your preferred order. Your name, a short introduction and a
          contact address you want to make public. A domain can wait. Use WebP or JPEG web copies
          and keep the originals.
      - title: Costs and publishing options
        body: The skill is free. Assistant, hosting, domain and renewal costs are reviewed separately. Start
          with Cloudflare; Squarespace uses its own editor to recreate the template. For mainland
          China audiences, keep Cloudflare as the starting recommendation and check the actual
          target network. After publishing on Cloudflare, review the available budget alerts.
      - title: Can the assistant help with the screen?
        body: When suitable computer tools are available, you can grant control for difficult steps.
          Otherwise, the assistant explains what to do next. Installing the skill does not add
          computer-control tools.
  ja:
    intro: 自分の写真を、自分のサイトで。
    demoTitle: 習作 01 — 作品の流れを静かに
    demoCaption: テンプレートのイメージ · 写真の代わりにイラストを使用
    demoPrompt: 海岸のシリーズのための作品集をつくってください。画面は静かに、作品は大きく。日本語、英語、中国語で読めるようにしたいです。
    revision: 画像にもっと余白を。一枚ずつカードにせず、シリーズをひとつの流れで見せてください。
    revisionNote: 習作ではテンプレートの縦並びを使い、一行に一枚の画像と控えめな作品目録を配置。装飾的なアニメーションはありません。試すための指示例であり、受託制作の会話記録ではありません。
    prepare: 写真を作品ごとに分け、見せたい順に並べてください。名前、短い紹介文、公開してよい連絡先も用意します。ドメインは後で決めても大丈夫です。ウェブ用の写真はWebPかJPEGで用意し、元のファイルは別に残します。
    firstPrompt: Portfolio Site
      Builderで写真のポートフォリオサイトをつくりたいです。まず会話に使う言語を聞いてから、費用の確認と写真の準備を手伝ってください。選んだ写真と順序は変えず、公開前にプレビューを見せてください。
    steps:
      - title: まず、作品のことから
        body: 会話の言語と費用を確認し、写真と紹介文を用意。
      - title: 最初のサイトをつくる
        body: テンプレートに作品を入れ、スマホとPCで確認。
      - title: 納得できたら公開
        body: Cloudflareを基本に、Squarespaceも選べます。
    principles:
      - title: つくるときに大切にしていること
        body: プリントを机に並べるように、写真を見ながら構成を考える。テンプレートの装飾は控えめにして、作品ごとの流れを大切にしました。写真の選択と順序は、撮り手が決めます。
    making:
      - title: 制作ノート
        body: テンプレートはHTML、CSS、JavaScriptでできています。日本語、英語、中国語の文章は個別に編集し、写真は共通です。ファイル一式、ライセンス、検証の記録はGitHubで公開しています。
    references:
      - title: ポートフォリオテンプレートを見る
        url: https://github.com/photoreason/skills/tree/main/skills/portfolio-site-builder/templates/portfolio
        reason: スキルに含まれるページ構成、スタイル、言語ファイル。自分の作品に合わせて手を加える出発点です。
    overview: 選んだ写真と短い紹介文から、テンプレートでサイトをつくります。プレビューを見ながら整えて、納得できたら公開しましょう。
    costNote: スキルは無料です。AIサービス、ドメイン、公開先の費用は別途確認します。
    outcomes:
      - title: 写真のためのテンプレート
        body: 大きな写真と余白。選んだ順序をそのままに。
      - title: 一覧でも、一枚ずつでも
        body: 作品一覧、サムネイル、全画面表示と拡大。
      - title: 公開した後も更新できる
        body: ファイルを手元に残し、写真や作品を追加できます。
    questions:
      - title: 用意するものは？
        body: 写真を作品ごとに分け、見せたい順に並べてください。名前、短い紹介文、公開してよい連絡先も用意します。ドメインは後で決めても大丈夫です。ウェブ用の写真はWebPかJPEGで用意し、元のファイルは別に残します。
      - title: 費用と公開先について
        body: スキル自体は無料です。AIサービス、サイトの公開先、ドメインの取得・更新にかかる費用は、最初に分けて確認します。基本はCloudflareで公開します。Squarespaceを選ぶ場合は、その編集画面でテンプレートの構成を再現します。中国本土向けの場合もCloudflareから検討し、実際の接続環境で確認します。
          Cloudflareで公開した後は、利用できる予算通知も確認します。
      - title: 画面の操作も任せられますか？
        body: 対応するツールがあれば、許可した範囲で操作を手伝えます。使えない場合は次の手順を説明するので、アカウントの画面は自分で操作します。このスキルを追加するだけで、PCを操作する機能が増えるわけではありません。
  zh-hans:
    intro: 给照片一个自己的地方。
    demoTitle: 习作 01 — 让观看慢下来
    demoCaption: 模板示意 · 以插画代替照片
    demoPrompt: 帮我为一组海岸作品做一个作品集。界面安静，照片足够大，并支持中文、英文和日文。
    revision: 给画面更多空间。让整组作品按顺序展开，不要把每张照片做成一张卡片。
    revisionNote: 习作采用模板的纵向布局：每行一张图，克制的项目目录，没有装饰性动画。这些是可尝试的修改方向，不是委托项目的对话记录。
    prepare: 照片按项目分好，保留希望展示的顺序。再准备署名、几句简介和愿意公开的联系方式。域名可以晚一点决定；已有域名也不必迁走。网页副本优先用 WebP 或 JPEG，原件另存。
    firstPrompt: 请用 Portfolio Site Builder 帮我做一个摄影作品集。先问我想用什么语言交流，再一起看费用、准备照片。保留我的选片和顺序，发布前先给我看预览。
    steps:
      - title: 先聊聊你的作品
        body: 选择交流语言，确认费用，整理照片和简介。
      - title: 一起做出第一版
        body: 套用模板，在手机和电脑上看看效果。
      - title: 满意以后再发布
        body: 优先使用 Cloudflare，也可选择 Squarespace。
    principles:
      - title: 我们为什么这样做
        body: 从整理纸质照片的桌面借一点思路：先有作品，再决定怎样摆放。模板尽量少做装饰，让每组照片有自己的节奏。选片和排序由你决定。
    making:
      - title: 制作手记
        body: 模板使用普通 HTML、CSS 和 JavaScript；中文、英文和日文分别编辑，共用同一组照片。完整文件、许可与检查记录都可以在 GitHub 查看。
    references:
      - title: 看看作品集模板
        url: https://github.com/photoreason/skills/tree/main/skills/portfolio-site-builder/templates/portfolio
        reason: 技能附带的页面结构、样式与语言文件。可以从这里开始，慢慢改成适合自己作品的样子。
    overview: 带着选好的照片和几句介绍，从模板开始搭建。助手会带你看预览、做调整，再发布成一个可以分享的网站。
    costNote: 技能免费。助手服务、域名和托管可能另计。
    outcomes:
      - title: 一套作品集模板
        body: 大图、留白，按你选好的顺序展示。
      - title: 看整组，也看细节
        body: 项目目录、缩略图、全屏浏览与放大。
      - title: 以后也能接着改
        body: 保留网站文件，想换照片或加项目时，再请助手帮忙。
    questions:
      - title: 需要准备哪些材料？
        body: 照片按项目分好，保留希望展示的顺序。再准备署名、几句简介和愿意公开的联系方式。域名可以晚一点决定；已有域名也不必迁走。网页副本优先用 WebP 或 JPEG，原件另存。
      - title: 费用和发布方式
        body: 技能本身免费。开始时会分别说明助手、托管、域名及续费成本。模板优先发布到 Cloudflare；选择 Squarespace 时，会在它的编辑器里按模板重建。面向大陆读者也会先考虑
          Cloudflare，再检查实际访问情况。 Cloudflare 上线后，也会帮你检查可用的预算提醒。
      - title: 能让助手帮我操作电脑吗？
        body: 可以在工具支持时授权它协助困难的步骤。没有电脑操作工具时，助手会说明下一步，由你完成账户页面。安装这个技能本身不会增加鼠标控制功能。
license: MIT
studyNumber: 1
